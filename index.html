<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>MP FX SNIPER</title>

<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background:#0b0f1a;
    color:white;
}

/* NAVBAR */
nav {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 30px;
    background:#000;
}

nav img {

}

nav a {
    color:white;
    text-decoration:none;
    margin-left:20px;
}

/* HERO */
.hero {
    text-align:center;
    padding:80px 20px;
}

.hero h1 {

}

.btn {
    display:inline-block;
    margin-top:15px;
    padding:12px 25px;
    background:#f5b400;
    color:black;
    text-decoration:none;
    border-radius:5px;
    font-weight:bold;
}

/* SECTION */
.section {
    padding:50px 20px;
    text-align:center;
}

.cards {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;

.card {
    background:#111;

    width:260px;

.price {

/* LOGIN MODAL */
.modal {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.8);
}

.modal-content {
    background:#111;
    padding:30px;
    margin:100px auto;
    width:300px;
    border-radius:10px;
    text-align:center;
}

input {
    width:90%;
    padding:10px;
    margin:10px 0;
}

/* VIP LOCK */
.locked {
    opacity:0.3;
}
</style>

</head>

<body>

<nav>
<img src="logo.png">
<div>
<a href="#">Home</a>
<a href="#" onclick="openLogin()">Login</a>
</div>
</nav>

<div class="hero">
<h1>SNIPER FOREX SIGNALS</h1>
<p>Gold Specialist | Smart Money Concepts</p>

<a class="btn" href="https://whatsapp.com/channel/0029Vb94riIHltY1ed5Ucq0m" target="_blank">
Join Free Channel
</a>
</div>

<div class="section">
<h2>💰 VIP SIGNAL ACCESS</h2>

<div id="vipCard" class="card locked">
<h3>VIP Channel Access</h3>
<p>Premium Sniper Signals</p>
<p class="price">$30 / Month</p>
<a class="btn" onclick="checkAccess()">Unlock VIP</a>
</div>

</div>

<div class="section">
<h2>🎓 TRAINING</h2>

<div class="cards">
<div class="card">
<h3>Beginner Course</h3>
<p>$100</p>
<a class="btn" href="https://wa.me/254716685237">Apply</a>
</div>

<div class="card">
<h3>Advanced Sniper</h3>
<p>$300</p>
<a class="btn" href="https://wa.me/254716685237">Apply</a>
</div>
</div>
</div>

<!-- LOGIN MODAL -->
<div id="loginModal" class="modal">
<div class="modal-content">
<h2>Login</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<br>
<button class="btn" onclick="login()">Login</button>
</div>
</div>

<script>
let isLoggedIn = false;

function openLogin(){
    document.getElementById("loginModal").style.display="block";
}

function login(){
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    if(email && password){
        isLoggedIn = true;
        alert("Login Successful ✅");
        document.getElementById("loginModal").style.display="none";
        document.getElementById("vipCard").classList.remove("locked");
    }
}

function checkAccess(){
    if(!isLoggedIn){
        alert("Please login first");
    } else {
        window.location.href="https://wa.me/254716685237";
    }
}
</script>
